<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DiskAtlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>{% block title %}DiskAtlas{% endblock %} · DiskAtlas</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ version }}">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
</head>
<body{% block bodyattrs %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-icon" src="{{ url_for('static', path='favicon.svg') }}" alt="" width="26" height="26">
      DiskAtlas
    </a>
    {% set path = request.url.path %}
    <nav>
      <a href="/" class="{{ 'active' if path == '/' or path.startswith('/disks') }}">Dashboard</a>
      <a href="/files" class="{{ 'active' if path.startswith('/files') }}">Dateisuche</a>
      <a href="/duplicates" class="{{ 'active' if path.startswith('/duplicates') }}">Doubletten</a>
      <a href="/scan" class="{{ 'active' if path.startswith('/scan') }}">Scannen</a>
      <a href="/labels" class="{{ 'active' if path.startswith('/labels') }}">Labels</a>
      <a href="/docs">API</a>
      {% if auth_enabled(request) %}<form method="post" action="/logout" class="logout-form"><button class="link" title="Abmelden">Abmelden</button></form>{% endif %}
    </nav>
  </header>
  <div id="activity" class="activity" role="status" aria-live="polite" hidden></div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>DiskAtlas {{ version }}</footer>
  <script src="{{ url_for('static', path='app.js') }}?v={{ version }}"></script>
</body>
</html>
