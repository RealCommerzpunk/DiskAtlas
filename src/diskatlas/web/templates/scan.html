<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DiskAtlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>DiskAtlas Scanner</title>
  <link rel="stylesheet" href="/static/scan.css?v={{ version }}">
</head>
<body class="app" data-mode="{{ mode }}" data-target="{{ target or '' }}">
  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="marks" aria-hidden="true"></canvas>
    <div class="guide" aria-hidden="true"></div>
    <div class="found" id="found" hidden><span>✓</span>Gefunden</div>
  </div>

  <header class="bar">
    <a class="round" href="/" aria-label="Zur Übersicht">‹</a>
    <div class="modes" role="tablist" aria-label="Modus">
      <button type="button" role="tab" data-mode="info">Info</button>
      <button type="button" role="tab" data-mode="find">Suchen</button>
    </div>
    <button type="button" class="round" id="torch" aria-label="Licht" aria-pressed="false" hidden>☀</button>
  </header>

  <div class="target" id="target" hidden>
    <div><small>Gesucht</small><strong id="target-name"></strong><span id="target-meta"></span></div>
    <button type="button" id="target-change">Ändern</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="start" id="start" hidden>
    <p id="start-msg">Die Kamera ist aus.</p>
    <button type="button" class="primary" id="start-btn">Kamera starten</button>
  </div>

  <section class="sheet" id="sheet" aria-live="polite" hidden></section>

  <section class="sheet picker" id="picker" hidden>
    <div class="sheet-head"><h2>Welche Platte suchst du?</h2><button type="button" class="round small" id="picker-close" aria-label="Schließen">✕</button></div>
    <input id="picker-q" type="search" placeholder="Name, Seriennummer, Label, Lagerort" autocomplete="off" autocorrect="off" spellcheck="false">
    <ul id="picker-list"></ul>
  </section>

  <footer class="foot">
    <form id="manual" class="manual" hidden>
      <input id="manual-input" type="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Seriennummer, z. B. WD-WCC4E2VRR0CJ" aria-label="Seriennummer">
      <button type="submit" class="primary">OK</button>
    </form>
    <button type="button" id="manual-toggle" class="link">Seriennummer eintippen</button>
  </footer>

  <script src="/static/vendor/zxing.min.js?v={{ version }}"></script>
  <script src="/static/scan.js?v={{ version }}"></script>
</body>
</html>
