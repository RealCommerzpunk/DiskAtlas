<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Anmelden · DiskAtlas</title>
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/static/favicon.svg" alt="" width="64" height="64" class="login-logo">
    <h1>DiskAtlas</h1>
    {% if error %}<p class="notice health-reasons failed" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Name
        <input name="nickname" autocomplete="username" autofocus required>
      </label>
      <label>Passwort
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Anmelden</button>
    </form>
    <p class="muted"><a href="/register">Zugang beantragen</a></p>
  </main>
</body>
</html>
