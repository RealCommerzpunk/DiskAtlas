name: Agent-Programm bauen

# Baut den Tray-Agenten als einzelne ausführbare Datei für Windows und Linux.
# Feature-Branches/PRs: nur als Artefakt (Reiter „Actions“ → Lauf → „Artifacts“).
# Versions-Tags (v0.4.0 …): zusätzlich an das GitHub-Release gehängt.
on:
  push:
    branches: ["feature/**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: DiskAtlas-Agent.exe
            asset: DiskAtlas-Agent-windows-x64.exe
          # Gebaut gegen Ubuntu 24.04 (Basis von Linux Mint 22); GTK/WebKit werden mitgeliefert.
          - os: ubuntu-24.04
            binary: diskatlas-agent
            asset: diskatlas-agent-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Umgebung (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[tray,build]"
          # smartctl.exe (smartmontools, GPL) mitliefern; Quellcode wird mitveröffentlicht.
          .venv\Scripts\python packaging/fetch_smartctl.py

      # Unter Linux kommen GTK, WebKit und AppIndicator aus den Systempaketen (python3-gi),
      # daher die System-Python mit Zugriff auf deren Pakete.
      - name: Umgebung (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-gi \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-ayatanaappindicator3-0.1
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[tray,build]"

      - name: Bauen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY -m PyInstaller --noconfirm --log-level WARN packaging/diskatlas-agent.spec
          ls -la dist
          mv "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Starttest (Linux)
        if: runner.os == 'Linux'
        run: dist/${{ matrix.asset }} --version

      # Echter Start: Tray im lokalen Betrieb (Oberfläche muss antworten) und das
      # Einstellungsfenster (muss offen bleiben). Die Protokolle landen im Build-Log.
      - name: Starttest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/${{ matrix.asset }}"
          $data = "$env:LOCALAPPDATA\diskatlas"
          $cfgDir = "$env:APPDATA\diskatlas"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          Set-Content "$cfgDir\config.toml" "[agent]`nserver_url = `"`"`nindex_files = false`n[server]`nport = 18766`n"
          $tray = Start-Process $exe -ArgumentList "-v" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ok = (Invoke-RestMethod http://127.0.0.1:18766/api/v1/health).status -eq "ok" } catch {}
          }
          $settings = Start-Process $exe -ArgumentList "--settings", "-v" -PassThru
          Start-Sleep 30
          $windowOpen = -not $settings.HasExited
          # Bildschirmfoto des Desktops (als Artefakt „starttest-windows“).
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\starttest-windows.png")
          Write-Host "--- agent-status.json"; Get-Content "$data\agent-status.json" -ErrorAction SilentlyContinue
          Write-Host "--- agent-tray.log"; Get-Content "$data\agent-tray.log" -ErrorAction SilentlyContinue
          Write-Host "--- agent-settings.log"; Get-Content "$data\agent-settings.log" -ErrorAction SilentlyContinue
          Write-Host "--- Oberfläche erreichbar: $ok, Einstellungsfenster offen: $windowOpen (Code $($settings.ExitCode))"
          Stop-Process -Id $settings.Id, $tray.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok -or -not $windowOpen) { throw "Starttest fehlgeschlagen." }

      - name: Bildschirmfoto vom Starttest
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: starttest-windows
          path: starttest-windows.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      # GPL: Der Quellcode des mitgelieferten smartctl liegt neben der .exe.
      - name: smartmontools-Quellcode als Artefakt
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: smartmontools-quellcode
          path: build/smartmontools-*.tar.gz
          if-no-files-found: error

      - name: An Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            build/smartmontools-*.tar.gz
