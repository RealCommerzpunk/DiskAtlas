[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "diskatlas"
dynamic = ["version"]
description = "Inventar für Festplatten: Hardware, SMART-Gesundheit, Belegung und Dateiindex – auch offline durchsuchbar."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["disk", "inventory", "smart", "hdd", "catalog"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# Linux: nutzt GTK/WebKit2, das auf Linux Mint/Ubuntu meist schon installiert ist
# (python3-gi, gir1.2-webkit2-4.1). Windows: pythonnet steuert die eingebaute WebView2-Engine.
gui = [
    "pywebview>=5.0",
    "pythonnet>=3.0.3; sys_platform == 'win32'",
]
# Agent als Tray-Programm (Symbol im Systembereich + Einstellungsfenster). Linux zusätzlich:
# python3-gi und gir1.2-ayatanaappindicator3-0.1 (auf Linux Mint meist vorhanden).
tray = [
    "pystray>=0.19.5",
    "pillow>=10.0",
    "pywebview>=5.0",
    "pythonnet>=3.0.3; sys_platform == 'win32'",
]
dev = ["pytest>=8", "ruff>=0.5"]
build = ["pyinstaller>=6.10", "pyinstaller-hooks-contrib>=2024.9"]

[project.scripts]
diskatlas = "diskatlas.cli:main"

[project.gui-scripts]
diskatlas-gui = "diskatlas.gui:main"
diskatlas-tray = "diskatlas.tray.app:main"

[tool.hatch.version]
path = "src/diskatlas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diskatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/diskatlas/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI-Depends in Default-Argumenten ist idiomatisch
