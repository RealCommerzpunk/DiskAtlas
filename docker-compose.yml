# Start: docker compose up -d   ->   http://<host>:8765
# Standard: SQLite im Verzeichnis ./data. Für PostgreSQL die auskommentierten Zeilen aktivieren.
services:
  diskatlas:
    build: .
    image: diskatlas:latest
    container_name: diskatlas
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      # Token, mit dem sich Agenten beim Senden ausweisen – unbedingt ändern!
      DISKATLAS_API_TOKEN: "bitte-aendern"
      # DISKATLAS_DATABASE_URL: "postgresql+psycopg://diskatlas:diskatlas@db:5432/diskatlas"
    # depends_on: [db]

