# DiskAtlas-Server (Weboberfläche + API + Datenbank) – z. B. für Unraid.
# Die Festplatten-Scans laufen per Agent auf den jeweiligen Rechnern (`diskatlas agent`).
#
# Start:  DISKATLAS_PASSWORD=... DISKATLAS_API_TOKEN=... docker compose up -d
#   oder Werte in eine Datei `.env` neben dieser Datei schreiben (wird nicht eingecheckt).
# Der Server startet bewusst NICHT ohne Passwort und Token, weil er im Netz lauscht.
# Standard: SQLite im Verzeichnis ./data. Für PostgreSQL die auskommentierten Zeilen aktivieren.
services:
  diskatlas:
    image: ghcr.io/realcommerzpunk/diskatlas:latest
    build: .
    container_name: diskatlas
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      # Passwort der Weboberfläche
      DISKATLAS_PASSWORD: "${DISKATLAS_PASSWORD:?bitte DISKATLAS_PASSWORD setzen}"
      # Token, mit dem sich Agenten beim Senden ausweisen (auch für Skripte an der API)
      DISKATLAS_API_TOKEN: "${DISKATLAS_API_TOKEN:?bitte DISKATLAS_API_TOKEN setzen}"
      # DISKATLAS_DATABASE_URL: "postgresql+psycopg://diskatlas:diskatlas@db:5432/diskatlas"
