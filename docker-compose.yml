# DiskAtlas-Server (Weboberfläche + API + Datenbank) – z. B. für Unraid.
# Die Festplatten-Scans laufen per Agent auf den jeweiligen Rechnern (`diskatlas agent`).
#
# Start:  DISKATLAS_PASSWORD=... docker compose up -d
#   oder den Wert in eine Datei `.env` neben dieser Datei schreiben (wird nicht eingecheckt).
# Beim allerersten Start ist das Passwort Pflicht (der Server lauscht im Netz), danach nicht mehr. Dann als „Admin“
# anmelden und unter „Konto“ für jeden Agenten einen Client mit eigenem Token anlegen.
# Standard: SQLite im Verzeichnis ./data. Für PostgreSQL die auskommentierten Zeilen aktivieren.
services:
  diskatlas:
    image: ghcr.io/realcommerzpunk/diskatlas:latest
    build: .
    container_name: diskatlas
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      # Startpasswort des Benutzers „Admin“ (nur beim allerersten Start nötig,
      # danach darf die Zeile leer bleiben)
      DISKATLAS_PASSWORD: "${DISKATLAS_PASSWORD:-}"
      # Relay für Kopien zwischen Rechnern (verschlüsselt, seriell): Höchstplatz in Bytes
      # DISKATLAS_RELAY_MAX_BYTES: "21474836480"
      # DISKATLAS_DATABASE_URL: "postgresql+psycopg://diskatlas:diskatlas@db:5432/diskatlas"
    # depends_on: [db]

